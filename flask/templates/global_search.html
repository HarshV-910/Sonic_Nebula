{% extends "base.html" %}

{% block content %}
<!-- Search Bar -->
<section class="relative z-40 mt-4 lg:mt-8 mb-8 lg:mb-12">
    <div class="max-w-3xl mx-auto relative">
        <form action="/global_search" method="GET" class="relative group">
            <span
                class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-primary/60 group-focus-within:text-primary transition-colors">search</span>
            <input name="q" value="{{ query or '' }}"
                class="w-full bg-surface-container-highest/60 backdrop-blur-2xl border border-white/5 rounded-2xl py-4 md:py-5 pl-12 pr-6 text-on-surface placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/30 transition-all font-body shadow-2xl text-sm md:text-base"
                placeholder="Search for artists, songs, or genres..." type="text" />
        </form>
    </div>
</section>

{% if results %}
<!-- Theater Mode Container -->
<div id="youtube-theater" class="hidden w-full max-w-5xl mx-auto flex-col gap-4 mb-12">
    <button onclick="closeTheater()"
        class="w-fit flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 hover:text-white transition-all font-medium text-sm">
        <span class="material-symbols-outlined text-lg">arrow_back</span>
        Back to search results
    </button>

    <div class="w-full aspect-video rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-black">
        <iframe id="youtube-iframe" class="w-full h-full" src="" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
    </div>

    <!-- 🔥 NEW: Fallback Button -->
    <a id="yt-fallback" target="_blank" class="hidden w-fit inline-flex items-center gap-2 px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-red-500/20 active:scale-95 mt-4">
        <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">smart_display</span>
        Watch on YouTube
    </a>

    <h2 id="youtube-theater-title" class="text-xl md:text-3xl font-bold font-headline mt-2 text-white"></h2>
</div>

<!-- Search Results -->
<section id="search-results-grid" class="mb-12">
    <h2 class="text-2xl md:text-3xl font-bold font-headline tracking-tighter mb-6">Results for "{{ query }}"</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {% for video in results %}
        <div class="group relative p-4 rounded-2xl bg-surface-container-high/40 backdrop-blur-xl border border-white/5 hover:border-primary/20 hover:shadow-[0_0_30px_rgba(129,236,255,0.05)] transition-all cursor-pointer"
            data-videoid="{{ video.video_id|e }}" data-title="{{ video.title|e }}"
            onclick="openTheater(this.dataset.videoid, this.dataset.title)">

            <div class="relative w-full aspect-video rounded-xl overflow-hidden mb-3 bg-zinc-800">
                <img src="{{ video.thumbnail_url }}" alt="Thumbnail"
                    class="w-full h-full object-cover transition-transform group-hover:scale-105">
                <div
                    class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <div class="w-12 h-12 bg-primary/90 rounded-full flex items-center justify-center shadow-lg">
                        <span class="material-symbols-outlined text-on-primary text-2xl"
                            style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    </div>
                </div>
            </div>

            <p class="font-bold text-on-surface text-sm truncate">{{ video.title }}</p>
            <p class="text-xs text-on-surface-variant mt-1">YouTube • Watch Video</p>
        </div>
        {% endfor %}
    </div>
</section>

{% endif %}

{% endblock %}
