name: CI-CD

on: push
    
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:

# basic env creation
      - name: code checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

# requirements installation and testing          

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

# AWS login for S3 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

# dvc data pull and testing app

      - name: DVC pull
        run: |
          dvc pull
          dvc pull data/processed/Music_Info_flask.csv.dvc
      
      - name: Run Application
        env:
          AWS_REGION: ap-southeast-2
          SECRET_KEY: test-secret-key-123
        run: |
          cd flask && nohup python -m gunicorn --preload --workers 2 --threads 4 --bind 0.0.0.0:8000 app:app > gunicorn.log 2>&1 &
        
      - name: Test App
        run: |
          pytest tests_app.py || (cat flask/gunicorn.log && exit 1)
      
      - name: Stop Application
        run: |
          pkill -f "gunicorn"

# AWS ECR login, build and push Docker image
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "sonic-nebula-ecr" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "sonic-nebula-ecr"

      - name: Build, tag and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sonic-nebula-ecr
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

# zipping and uploading to S3 for AWS CodeDeploy
      - name: Create .env file for deployment
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" > .env

      - name: Zip files for deployment
        if: success()
        run: |
          zip -r deployment.zip appspec.yml deploy/scripts/install_dependencies.sh deploy/scripts/start_docker.sh .env

      - name: Upload zip to S3
        if: success()
        run: |
          aws s3 cp deployment.zip s3://sonic-nebula-deploy-bkt/deployment.zip --region ap-southeast-2

# for deployment to AWS CodeDeploy using the uploaded zip file in S3
      - name: Deploy to AWS CodeDeploy
        if: success()
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws deploy create-deployment \
          --application-name sonic-nebula-app \
          --deployment-config-name CodeDeployDefault.AllAtOnce \
          --deployment-group-name sonic-nebula-deploy-grp \
          --s3-location bucket=sonic-nebula-deploy-bkt,key=deployment.zip,bundleType=zip \
          --file-exists-behavior OVERWRITE \
          --region ap-southeast-2


